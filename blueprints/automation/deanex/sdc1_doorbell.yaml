blueprint:
  name: SDC-1 — Doorbell notification
  description: >
    Sends a notification when someone presses the SDC-1 doorbell, optionally
    with a camera snapshot. Uses the device's `event` entity, so repeated
    presses each fire correctly.
  domain: automation
  author: Deanex International
  source_url: https://github.com/deanex-international/sdc-1/blob/main/blueprints/automation/deanex/sdc1_doorbell.yaml
  input:
    doorbell:
      name: Doorbell
      description: The SDC-1 doorbell event entity.
      selector:
        entity:
          filter:
            - domain: event
              device_class: doorbell
    notify_target:
      name: Notification service
      description: e.g. notify.mobile_app_your_phone
      selector:
        text:
    camera:
      name: Camera (optional)
      description: If set, a snapshot is attached to the notification.
      default: {}
      selector:
        entity:
          filter:
            - domain: camera
    message:
      name: Message
      default: Someone is at the door.
      selector:
        text:
    cooldown:
      name: Cooldown
      description: Ignore further presses for this long.
      default: 30
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input doorbell

variables:
  cam: !input camera

conditions:
  # A restart repopulates entity states; only react to a genuine press.
  - condition: template
    value_template: "{{ trigger.from_state is not none }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ cam is not none and cam | string | length > 0 }}"
        sequence:
          - action: camera.snapshot
            target:
              entity_id: !input camera
            data:
              filename: /config/www/sdc1_doorbell.jpg
          - action: !input notify_target
            data:
              title: Doorbell
              message: !input message
              data:
                image: /local/sdc1_doorbell.jpg
    default:
      - action: !input notify_target
        data:
          title: Doorbell
          message: !input message

  - delay:
      seconds: !input cooldown
